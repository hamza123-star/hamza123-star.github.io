name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          AE74AC: ${{ secrets.AE74AC }}
          B85021: ${{ secrets.B85021 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('AE74AC', '')
          meta_b = os.environ.get('B85021', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- f456af859828559b10fd1f9a6f -->', meta_a)
          if meta_b:
              out = out.replace('<!-- ba247b5f7f014ab1ef3bfc503e63cf43b84c -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
